name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (leave empty to use the VERSION file)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Tests
        run: |
          # LiveSourceTests hit real book sites; they are local smoke checks, not a release
          # gate, so CI must not fail because a third-party host is down.
          swift test --skip LiveSourceTests

      - name: Determine Release Tag
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -f "VERSION" ]; then
            TAG=$(cat VERSION | tr -d '[:space:]')
          else
            TAG="v0.2.2"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -project Legado.xcodeproj \
            -scheme LegadoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LegadoApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        id: package
        run: |
          mkdir -p build/Payload
          cp -R build/LegadoApp.xcarchive/Products/Applications/LegadoApp.app build/Payload/
          cd build
          RELEASE_TAG="${{ steps.version_step.outputs.tag }}"
          zip -r "Legado-${RELEASE_TAG}.ipa" Payload
          ls -la "Legado-${RELEASE_TAG}.ipa"
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-${{ steps.version_step.outputs.tag }}-ipa
          path: build/Legado-*.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "Legado iOS ${{ steps.version_step.outputs.tag }}"
          prerelease: false
          draft: false
          generate_release_notes: true
          files: build/Legado-*.ipa
          body: |
            ### Legado iOS (开源阅读 iOS 版) ${{ steps.version_step.outputs.tag }}

            #### 🌟 更新内容
            详细更新日志请参阅仓库内 [UPDATE_LOG.md](UPDATE_LOG.md) 与 [README.md](README.md)。
            - **v0.2.4**：纵向连续滚动排版重构与全自动无缝长卷阅读；常驻系统顶栏状态栏；P0 核心遗留项清零（顶栏换源/刷新快捷、章节内容编辑 EditContentSheet、WebDAV 进度双向同步、滚动朗读段落高亮与自动平滑居中）；iOS 15 顶栏多按钮兼容性修复。
            - **v0.2.3**：书源/书架/规则/订阅/音频全工具链对齐 Android，WebDAV 10 类数据备份互通，XPath 规则引擎，WiFi 局域网传书与 URL Scheme 导入。
            #### 📱 安装说明
            下载下方的 `Legado-*.ipa` 附件，支持通过以下方式进行侧载安装：
            - **TrollStore**（巨魔商店，推荐，免签名永不过期）
            - **AltStore / SideStore**（个人免费证书签名）
            - **Sideloadly / 爱思助手**
