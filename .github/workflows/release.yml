name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (leave empty to use the VERSION file)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Tests
        run: |
          # LiveSourceTests hit real book sites; they are local smoke checks, not a release
          # gate, so CI must not fail because a third-party host is down.
          swift test --skip LiveSourceTests

      - name: Determine Release Tag
        id: version_step
        env:
          RELEASE_TAG_OVERRIDE: ${{ github.event.inputs.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG_OVERRIDE" ]; then
            TAG="$RELEASE_TAG_OVERRIDE"
          elif [ -f "VERSION" ]; then
            TAG=$(cat VERSION | tr -d '[:space:]')
          else
            echo "VERSION file is missing" >&2
            exit 1
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || exit 1
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -project Legado.xcodeproj \
            -scheme LegadoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LegadoApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        id: package
        run: |
          mkdir -p build/Payload
          cp -R build/LegadoApp.xcarchive/Products/Applications/LegadoApp.app build/Payload/
          cd build
          RELEASE_TAG="${{ steps.version_step.outputs.tag }}"
          zip -r "Legado-${RELEASE_TAG}.ipa" Payload
          ls -la "Legado-${RELEASE_TAG}.ipa"
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-${{ steps.version_step.outputs.tag }}-ipa
          path: build/Legado-*.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "Legado iOS ${{ steps.version_step.outputs.tag }}"
          prerelease: false
          draft: false
          generate_release_notes: true
          files: build/Legado-*.ipa
          body: |
            ### Legado iOS (开源阅读 iOS 版) ${{ steps.version_step.outputs.tag }}

            #### 🌟 更新内容
            详细功能特性与实施规划请参阅仓库内 [README.md](README.md) 与 [Plan.md](Plan.md)。
            - **登录 / 响应**：接入原生 login()、RowUi 按钮和 loginCheckJs 响应替换，保留最终 URL 与刷新的登录头；凭据更新不覆盖并行编辑。
            - **RSS**：JS / JSON 分类、共享 jsLib / 头 / 变量、逆序与 PAGE 翻页、取消与去重；HTML / 图片 / 自定义 CSS、JS 与 baseURL 开关及单页入口。
            - **浏览器 / 导入**：应用内导航和原生下载，TXT / EPUB 可入库；扫码及 legado / yuedu 规则直链先下载预览再导入。
            - **验证**：418 项非联网测试、3 skipped、0 失败；完整 Java 对象 / webJs 请求及所有验证站点仍在后续差距中。

            #### 📱 安装说明
            下载下方的 `Legado-*.ipa` 附件，支持通过以下方式进行侧载安装：
            - **TrollStore**（巨魔商店，推荐，免签名永不过期）
            - **AltStore / SideStore**（个人免费证书签名）
            - **Sideloadly / 爱思助手**
