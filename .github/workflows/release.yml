name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (leave empty to use the VERSION file)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Tests
        run: |
          # LiveSourceTests hit real book sites; they are local smoke checks, not a release
          # gate, so CI must not fail because a third-party host is down.
          swift test --skip LiveSourceTests

      - name: Determine Release Tag
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -f "VERSION" ]; then
            TAG=$(cat VERSION | tr -d '[:space:]')
          else
            TAG="v0.2.2"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -project Legado.xcodeproj \
            -scheme LegadoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LegadoApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        id: package
        run: |
          mkdir -p build/Payload
          cp -R build/LegadoApp.xcarchive/Products/Applications/LegadoApp.app build/Payload/
          cd build
          RELEASE_TAG="${{ steps.version_step.outputs.tag }}"
          zip -r "Legado-${RELEASE_TAG}.ipa" Payload
          ls -la "Legado-${RELEASE_TAG}.ipa"
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-${{ steps.version_step.outputs.tag }}-ipa
          path: build/Legado-*.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "Legado iOS ${{ steps.version_step.outputs.tag }}"
          prerelease: false
          draft: false
          generate_release_notes: true
          files: build/Legado-*.ipa
          body: |
            ### Legado iOS (开源阅读 iOS 版) ${{ steps.version_step.outputs.tag }}

            #### 🌟 更新内容
            详细功能特性与实施规划请参阅仓库内 [README.md](README.md) 与 [Plan.md](Plan.md)。
            - **书源运行时基础**：执行内联 / 远程 jsLib、刷新前 preUpdateJs，以及 refreshTocUrl / reGetBook；保护书籍迁移时的进度与书架身份。
            - **阅读器修复**：退出首章 / 未缓存章节加载时取消请求与预取；拒绝晚到结果；换源时清理旧任务，加载页提供返回书架按钮。
            - **代码复核**：修复已删除变量返回旧值、取消竞争与旧源正文回写；移除重复进度保存。
            - **验证**：363 项非联网测试，3 项外部样本显式 skipped，0 失败；iOS Simulator 编译通过。未做本轮真机 / 实际退出交互验收。
            - **版本边界**：App 仍使用 JavaScriptCore，无法硬中断运行中的纯 JS 死循环；QuickJS 仅完成独立调查原型，v0.3.1 开始原生适配器接入。

            #### 📱 安装说明
            下载下方的 `Legado-*.ipa` 附件，支持通过以下方式进行侧载安装：
            - **TrollStore**（巨魔商店，推荐，免签名永不过期）
            - **AltStore / SideStore**（个人免费证书签名）
            - **Sideloadly / 爱思助手**
