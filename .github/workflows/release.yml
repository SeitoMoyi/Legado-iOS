name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (leave empty to use the VERSION file)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Tests
        run: |
          # LiveSourceTests hit real book sites; they are local smoke checks, not a release
          # gate, so CI must not fail because a third-party host is down.
          swift test --skip LiveSourceTests

      - name: Determine Release Tag
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -f "VERSION" ]; then
            TAG=$(cat VERSION | tr -d '[:space:]')
          else
            TAG="v0.2.2"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -project Legado.xcodeproj \
            -scheme LegadoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LegadoApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        id: package
        run: |
          mkdir -p build/Payload
          cp -R build/LegadoApp.xcarchive/Products/Applications/LegadoApp.app build/Payload/
          cd build
          RELEASE_TAG="${{ steps.version_step.outputs.tag }}"
          zip -r "Legado-${RELEASE_TAG}.ipa" Payload
          ls -la "Legado-${RELEASE_TAG}.ipa"
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-${{ steps.version_step.outputs.tag }}-ipa
          path: build/Legado-*.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "Legado iOS ${{ steps.version_step.outputs.tag }}"
          prerelease: false
          draft: false
          generate_release_notes: true
          files: build/Legado-*.ipa
          body: |
            ### Legado iOS (开源阅读 iOS 版) ${{ steps.version_step.outputs.tag }}

            #### 🌟 v0.2.2 核心更新（缓存与离线可用性）
            - **打开书籍改为缓存优先**：目录（TOC）此前每次进阅读器都强制联网抓取，既慢又导致离线打不开；现在先读本地目录缓存并立即渲染，超过 10 分钟才后台静默重爬，抓到新目录才回写缓存。**已缓存的书现在可以离线打开**。
            - **追更**：读到倒数 3 章内自动后台刷新目录；目录变化时按章节名相似度重定位，不会把读者甩回第一章；仅「纯追加」保留按 index 存的正文缓存，结构变化则清除以防串章。
            - **离线不再困住阅读器**：加载失败页新增「返回书架」；修掉「重试」是一个直接 return 的死按钮；失败视图可点出菜单；错误提示补上可操作的下一步。
            - **章节失败不再盖住整页**：已有可读内容时只提示一次并保留当前页。
            - **超时与截断保护**：请求超时 60s → 30s；目录续页增加总时长预算与页数上限双闸；**被截断的目录或正文一律不写缓存**。
            - **朗读**：新增屏幕底部常驻的**悬浮控制条**（播放 / 暂停 / 结束，不随菜单收起而消失）；改为**从当前页首个字开始朗读**；不再念出 `[image:…]` 插图标记。
            - 🗑 **删除音量键翻页**：iOS 拦音量键只能借隐藏的 `MPVolumeView`，其 slider 写入即真改系统音量，实测会把音量一路压到 0。
            - ⚙️ **设置页**：删除「阅读器显示设置」块，阅读设置唯一入口收敛到阅读页面板；板块顺序改为 书源管理 → 书架与存储 → 外观模式 → 数据与云备份 → 正文处理 → 关于。
            - 🧪 **测试分层**：5 个访问真实书源的用例移入 `LiveSourceTests`，主机不可达时自动 skip 而非 fail；CI 门槛为 `swift test --skip LiveSourceTests`（确定性 191 例）。

            #### 📱 安装说明
            下载下方的 `Legado-*.ipa` 附件，支持通过以下方式进行侧载安装：
            - **TrollStore**（巨魔商店，推荐，免签名永不过期）
            - **AltStore / SideStore**（个人免费证书签名）
            - **Sideloadly / 爱思助手**
