name: Build & Pre-Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  build-and-release:
    name: Build & Release IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Tests
        run: |
          swift test

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -project Legado.xcodeproj \
            -scheme LegadoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LegadoApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/LegadoApp.xcarchive/Products/Applications/LegadoApp.app build/Payload/
          cd build
          RELEASE_TAG="${{ github.ref_name }}"
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "main" ]; then
            RELEASE_TAG="${{ github.event.inputs.tag_name || 'v0.1.0' }}"
          fi
          zip -r "Legado-${RELEASE_TAG}.ipa" Payload
          ls -la "Legado-${RELEASE_TAG}.ipa"

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: "Legado iOS ${{ github.ref_name || github.event.inputs.tag_name }} (Preview)"
          prerelease: true
          draft: false
          generate_release_notes: true
          files: build/Legado-*.ipa
          body: |
            ### Legado iOS (开源阅读 iOS 版) Pre-release ${{ github.ref_name || github.event.inputs.tag_name }}

            #### 🌟 核心功能
            - **Legado 3.0 书源生态**：兼容 CSS/XPath/JSONPath/正则/JS/模版混合规则，支持本地 `.json` 文件导入、网络导入与内置 Web 交互登录。
            - **底部分类发现流**：三级快速切换（书源药丸切换 -> 预设分类与矩阵弹窗 -> 书籍流与无限分页）。
            - **沉浸式全屏阅读器**：多主题（羊皮纸、柔光暗调、纯黑夜间、护眼绿）、覆盖/平滑/垂直三种翻页模式、全屏点按控制、章节滑块跳转、离线正文缓存与单书缓存清理。
            - **WebDAV 多端互通**：深度兼容 Android 端 Legado 备份包（`backup*.zip` 及 `bookProgress/` 快照），支持本地直接导入与云端同步。
            - **全局暗黑模式**：跟随系统、浅色、深色模式自由切换。

            #### 📱 安装说明
            下载下方的 `Legado-*.ipa` 附件，支持通过以下方式进行侧载安装：
            - **TrollStore**（巨魔商店，推荐，免签名永不过期）
            - **AltStore / SideStore**（个人证书签名）
            - **Sideloadly / 爱思助手**
